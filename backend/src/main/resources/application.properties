spring.profiles.default=local
spring.datasource.url=${JIBRO_DATABASE_URL:jdbc:h2:file:./.local-data/members;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${JIBRO_DATABASE_USER:sa}
spring.datasource.password=${JIBRO_DATABASE_PASSWORD:}
spring.flyway.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never
server.forward-headers-strategy=none
jibro.accounts.origin=${JIBRO_APP_ORIGIN:http://127.0.0.1:5173}
jibro.accounts.keys=${JIBRO_NOTEBOOK_KEYS:}
jibro.accounts.key-file=${JIBRO_NOTEBOOK_KEY_FILE:./.local-data/notebook-keys.json}
jibro.accounts.mail-key=${JIBRO_RESEND_API_KEY:}
jibro.accounts.mail-from=${JIBRO_MAIL_FROM:}
jibro.accounts.test-login=false
