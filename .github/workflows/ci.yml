name: JIBRO CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend data rules
        run: npm test

      - name: Build frontend
        run: npm run build

  backend:
    name: Backend build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jibro_test
          POSTGRES_USER: jibro_test
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U jibro_test -d jibro_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build backend
        run: sh ./gradlew --no-daemon build

      - name: Verify member transactions and migration on PostgreSQL
        env:
          JIBRO_TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/jibro_test
          JIBRO_TEST_DATABASE_USER: jibro_test
          JIBRO_TEST_DATABASE_PASSWORD: ci-only-password
        run: sh ./gradlew --no-daemon test --tests com.jibro.api.member.AccountIntegrationTest --rerun-tasks

  snapshot-tools:
    name: Snapshot tools tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install analysis dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r backend/scripts/requirements.txt

      - name: Test snapshot parsers without contacting LH
        run: .venv/bin/python -m unittest discover -s backend/scripts -p 'test_*.py'
