name: JIBRO CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend data rules
        run: npm test

      - name: Build frontend
        run: npm run build

  backend:
    name: Backend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build backend
        run: sh ./gradlew --no-daemon build

  snapshot-tools:
    name: Snapshot tools tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install analysis dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r backend/scripts/requirements.txt

      - name: Test snapshot parsers without contacting LH
        run: .venv/bin/python -m unittest discover -s backend/scripts -p 'test_*.py'
